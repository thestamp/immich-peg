<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immich Peg</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-input: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.container { width: 100%; max-width: 800px; padding: 24px; }
.header { padding: 20px 0; text-align: center; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
.header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
.header p { color: var(--text-dim); margin-top: 4px; font-size: 14px; }
.spinner { display: flex; justify-content: center; align-items: center; height: 200px; }
.spinner::after { content: ''; width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Immich Peg</h1>
    <p>Sync sidecar for Immich instances</p>
  </div>
  <div class="spinner" id="spinner"></div>
  <div id="content" style="display:none;"></div>
</div>
<script>
(async () => {
  try {
    const r = await fetch('/api/setup/status');
    const d = await r.json();
    document.getElementById('spinner').style.display = 'none';
    if (d.setupComplete) {
      window.location.replace('/dashboard.html');
    } else {
      window.location.replace('/setup.html');
    }
  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('content').innerHTML = '<div style="text-align:center;padding:40px;color:var(--red)">Cannot connect to API. Is the service running?</div>';
  }
})();
</script>
</body>
</html>
