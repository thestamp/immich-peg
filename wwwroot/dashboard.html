<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Immich Peg</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #21262d; --border: #30363d;
  --text: #c9d1d9; --text-dim: #8b949e; --accent: #58a6ff; --accent-hover: #79c0ff;
  --green: #3fb950; --red: #f85149; --yellow: #d2991d; --pink: #ff0084; --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
nav { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 24px; }
nav .logo { font-size: 18px; font-weight: 600; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
nav .logo img { width: 32px; height: 32px; border-radius: 8px; }
nav .logo span { color: var(--accent); }
nav a { color: var(--text-dim); text-decoration: none; font-size: 14px; transition: color 0.2s; }
nav a:hover, nav a.active { color: var(--text); }
nav .spacer { flex: 1; }
.container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 24px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
.metric { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.metric .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.metric .value { font-size: 28px; font-weight: 600; }
.metric .value.green { color: var(--green); }
.metric .value.red { color: var(--red); }
.metric .value.yellow { color: var(--yellow); }
.metric .value.pink { color: var(--pink); }
.metric .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 16px; margin-bottom: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.status-dot.ok { background: var(--green); }
.status-dot.down { background: var(--red); }
.status-dot.syncing { background: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-flickr { background: var(--pink); color: #fff; }
.btn-flickr:hover { background: #ff339d; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.sync-status { font-size: 13px; color: var(--text-dim); margin-top: 8px; padding: 8px 12px; background: var(--bg-input); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
td { color: var(--text); }
.empty { text-align: center; padding: 32px; color: var(--text-dim); font-size: 14px; }
.health-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.health-item { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
.badge.warn { background: rgba(210,153,29,0.15); color: var(--yellow); }
.badge.err { background: rgba(248,81,73,0.15); color: var(--red); }
.badge.pink { background: rgba(255,0,132,0.15); color: var(--pink); }
.hidden { display: none; }
#notSetUp { text-align: center; padding: 60px 20px; }
#notSetUp h2 { font-size: 22px; margin-bottom: 8px; }
#notSetUp p { color: var(--text-dim); margin-bottom: 20px; }
.sync-bar { display: flex; align-items: center; gap: 10px; }
.progress-bar { flex: 1; height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--yellow); border-radius: 2px; transition: width 0.5s; }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo"><img src="/logo.png" alt="Immich Peg"> <span>Immich Peg</span></a>
  <a href="/dashboard.html" class="active">Dashboard</a>
  <a href="/settings.html">Settings</a>
  <div class="spacer"></div>
</nav>

<div class="container">
  <div class="hidden" id="notSetUp">
    <h2>Not Configured</h2>
    <p>Run the setup wizard to configure Immich Peg.</p>
    <a href="/setup.html" class="btn btn-primary">Run Setup →</a>
  </div>

  <div class="hidden" id="dashboard">
    <div class="card">
      <h2>System Health <span id="healthIndicator"></span></h2>
      <div class="health-row">
        <div class="health-item"><span class="status-dot" id="dotMain"></span> Main: <strong id="healthMain">-</strong></div>
        <div class="health-item" id="flickrHealth" style="display:none"><span class="status-dot" id="dotFlickr"></span> Flickr: <strong id="healthFlickr">-</strong></div>
        <span style="color:var(--text-dim);font-size:13px;margin-left:8px" id="healthLastCheck"></span>
      </div>
    </div>

    <div class="metrics" id="metrics">
      <div class="metric"><div class="label">Shared Albums</div><div class="value" id="statShared">0</div></div>
      <div class="metric"><div class="label">Synced</div><div class="value green" id="statSynced">0</div></div>
      <div class="metric"><div class="label">Photos Uploaded</div><div class="value pink" id="statPhotos">0</div></div>
      <div class="metric"><div class="label">Photos Deleted</div><div class="value red" id="statDeleted">0</div></div>
    </div>

    <div class="card">
      <h2>Sync Status <span class="status-dot" id="syncDot"></span></h2>
      <div class="sync-bar">
        <span id="syncStatusText" style="font-size:14px">Idle</span>
        <div class="progress-bar hidden" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="sync-status" id="syncInfo">Last sync: never</div>
      <div class="btn-row">
        <button class="btn btn-flickr" id="btnFlickr" onclick="startSync()">🔄 Sync Now</button>
      </div>
    </div>

    <div class="card">
      <h2>Albums <span style="font-size:12px;color:var(--text-dim);font-weight:400" id="albumSummary"></span></h2>
      <div id="albumTable"></div>
    </div>

    <div class="card">
      <h2>Recent Activity</h2>
      <div id="recentTable"></div>
    </div>
  </div>
</div>

<script>
const POLL_MS = 5000;
let pollTimer;

async function loadDashboard() {
  try {
    const [dr, fr] = await Promise.all([fetch('/api/dashboard'), fetch('/api/flickr/status').catch(() => null)]);
    if (!dr.ok) throw new Error('API error');
    const d = await dr.json();
    if (!d.setupComplete) { document.getElementById('notSetUp').classList.remove('hidden'); document.getElementById('dashboard').classList.add('hidden'); return; }
    document.getElementById('notSetUp').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    // Health
    const mainOk = d.health?.main;
    document.getElementById('healthMain').textContent = mainOk ? 'UP' : 'DOWN';
    document.getElementById('dotMain').className = 'status-dot ' + (mainOk ? 'ok' : 'down');
    document.getElementById('healthLastCheck').textContent = d.lastSync ? new Date(d.lastSync).toLocaleString() : '';

    // Flickr health
    if (fr && fr.ok) {
      const fs = await fr.json();
      if (fs.configured) {
        document.getElementById('flickrHealth').style.display = '';
        document.getElementById('healthFlickr').textContent = fs.authorized ? (fs.enabled ? 'UP' : 'OFF') : 'NO AUTH';
        document.getElementById('dotFlickr').className = 'status-dot ' + (fs.authorized && fs.enabled ? 'ok' : 'down');
      }
    }

    // Metrics
    document.getElementById('statShared').textContent = d.totalSharedAlbums || 0;
    document.getElementById('statSynced').textContent = d.totalSyncedAlbums || 0;
    document.getElementById('statPhotos').textContent = d.totalAssetsCopiedEver || 0;
    document.getElementById('statDeleted').textContent = d.totalAssetsDeletedEver || 0;

    // Sync status
    const syncing = d.syncActive;
    document.getElementById('syncDot').className = 'status-dot ' + (syncing ? 'syncing' : 'ok');
    document.getElementById('syncStatusText').textContent = syncing ? 'Syncing...' : 'Idle';
    document.getElementById('progressBar').classList.toggle('hidden', !syncing);
    document.getElementById('btnFlickr').disabled = syncing;

    if (d.lastSyncStatus === 'running' || syncing) {
      document.getElementById('syncInfo').textContent = 'Sync in progress...';
    } else if (d.lastSyncStatus === 'never') {
      document.getElementById('syncInfo').textContent = 'No sync run yet';
    } else {
      document.getElementById('syncInfo').textContent = 'Last sync: ' + new Date(d.lastSync).toLocaleString() + ' — ' + (d.lastSyncMessage || d.lastSyncStatus);
    }

    // Album table
    const albums = d.albumStatuses || [];
    document.getElementById('albumSummary').textContent = albums.length + ' albums, ' + albums.filter(a => a.synced).length + ' synced';
    document.getElementById('albumTable').innerHTML = albums.length === 0 ? '<div class="empty">No shared albums found</div>' :
      '<table><tr><th>Album</th><th>Assets</th><th>Flickr</th><th>Status</th></tr>' + 
      albums.map(a => '<tr>' +
        '<td>' + esc(a.albumName) + '</td>' +
        '<td>' + a.assetCount + '</td>' +
        '<td>' + (a.flickrAlbumId ? '✓' : '—') + '</td>' +
        '<td><span class="badge ' + (a.synced ? 'ok' : a.flickrAlbumId ? 'warn' : 'err') + '">' + (a.synced ? 'Synced' : a.flickrAlbumId ? 'Partial' : 'Not synced') + '</span></td>' +
        '</tr>').join('') + '</table>';

    // Recent activity
    const recent = d.recentAssets || [];
    document.getElementById('recentTable').innerHTML = recent.length === 0 ? '<div class="empty">No recent activity</div>' :
      '<table><tr><th>Action</th><th>Item</th><th>Album</th><th>Time</th></tr>' + 
      recent.slice(0, 20).map(a => {
        const badgeCls = a.action === 'deleted' ? 'err' : a.action === 'created' || a.action === 'removed' ? 'warn' : 'ok';
        const icon = a.entity === 'album' ? (a.action === 'removed' ? '🗑 Album removed' : '📁 Album created') :
                     a.action === 'deleted' ? '🗑 Deleted' : '📤 Added';
        return '<tr>' +
          '<td><span class="badge ' + badgeCls + '">' + icon + '</span></td>' +
          '<td>' + esc(a.filename) + '</td>' +
          '<td>' + esc(a.albumName) + '</td>' +
          '<td>' + new Date(a.timestamp).toLocaleString() + '</td>' +
          '</tr>';
      }).join('') + '</table>';

  } catch(e) {
    document.getElementById('notSetUp').classList.remove('hidden');
    document.getElementById('notSetUp').innerHTML = '<h2>Connection Error</h2><p>' + esc(e.message) + '</p><button class="btn btn-primary" onclick="loadDashboard()">Retry</button>';
  }
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function startSync() {
  document.getElementById('btnFlickr').disabled = true;
  try { await fetch('/api/sync/flickr', { method: 'POST' }); } catch(e) {}
  setTimeout(loadDashboard, 1500);
}

loadDashboard();
pollTimer = setInterval(loadDashboard, POLL_MS);
</script>
</body>
</html>
